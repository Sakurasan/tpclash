name: TPClash

on:
  workflow_dispatch:
    inputs:
      trigger:
        description: Manually trigger
        required: true
        type: choice
        options:
          - build
  schedule:
    # 每周日 00:00 UTC 自动编译(含 mihomo/yacd 等最新依赖)
    - cron: '0 0 * * 0'

env:
  FORCE_COLOR: 1
  CGO_ENABLED: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Put back the git branch into git
      shell: bash
      run: |
        branch=""
        if [ -n "$GITHUB_HEAD_REF" ]; then
          branch="$GITHUB_HEAD_REF"
        else
          branch="${GITHUB_REF##*/}"
        fi
        git checkout -b "$branch" || true
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '26.x'
    - name: Use Golang
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    - name: Install Deps
      shell: bash
      run: |
        curl -fsSL https://mise.run | sh
        sudo apt-get update -y && sudo apt-get install -y jq gzip
        npm install -g pnpm
    - name: Setup Tools (mise)
      shell: bash
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        mise trust
        mise install
        mise version
    - name: Build TPClash
      shell: bash
      run: |
        export PATH="$HOME/.local/bin:$PATH"
        mise run default
    - name: Get current date
      id: timestamp
      run: |
        export TZ='Asia/Shanghai'
        echo "date=$(date '+%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tpclash-${{ steps.timestamp.outputs.date }}
        path: build 

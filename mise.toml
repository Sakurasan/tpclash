[tools]
golang = "1.26.5"
node = "24"

[settings]

# ---------------------------------------------------------------------------
# TPClash 构建任务 (使用 mise 内置任务运行器, 无需 go-task)
#
# 用法:
#   mise run                   # 构建 linux-arm64 + linux-amd64 并打包
#   mise run linux-arm64-mihomo
#   mise run linux-amd64-mihomo
#   mise run clean
#
# 依赖命令: curl, jq, git, gzip, pnpm (node 由 mise 提供)
# ---------------------------------------------------------------------------

[tasks.clean]
run = """
  rm -rf build static
  rm -rf *.tmp
"""

[tasks.prepare-dashboard]
run = """
  mkdir -p build static
  if [ -f static/Country.mmdb ]; then :; else
    curl -sSL https://cdn.jsdelivr.net/gh/Hackl0us/GeoIP2-CN@release/Country.mmdb > static/Country.mmdb
  fi

  if [ -d static/yacd ] && [ -d static/official ]; then
    echo "[mise] dashboards already built, skip"
    exit 0
  fi

  YACD_VER=$(curl -sSL https://api.github.com/repos/MetaCubeX/Yacd-meta/releases/latest | jq -r '.name')
  MCXD_VER=$(curl -sSL https://api.github.com/repos/MetaCubeX/metacubexd/releases/latest | jq -r '.name')

  rm -rf build/yacd build/official
  git clone --depth 1 --branch "$YACD_VER" https://github.com/MetaCubeX/Yacd-meta.git build/yacd
  # 修复: yacd 默认 API 地址跟随当前访问地址(window.location.origin), 而非硬编码 127.0.0.1:9090
  # (用 `sed -i ''` 以兼容 macOS/Linux; 每次补丁后立即校验, 上游改版导致补丁失效时构建直接失败)
  # 1) app.ts: data-base-url 缺省时回退到当前 origin
  sed -i '' "s|.getAttribute('data-base-url') ?? 'http://127.0.0.1:9090'|.getAttribute('data-base-url') ?? window.location.origin|" build/yacd/src/store/app.ts
  grep -q "?? window.location.origin" build/yacd/src/store/app.ts || { echo "[mise] ERROR: yacd app.ts 补丁未生效" >&2; exit 1; }
  # 2) index.html: 移除硬编码的 data-base-url 属性(否则上面的回退分支永远不生效)
  sed -i '' 's| data-base-url="[^"]*"||' build/yacd/index.html
  if grep -q 'data-base-url' build/yacd/index.html; then
    echo "[mise] ERROR: yacd index.html 补丁未生效" >&2
    exit 1
  fi
  # 3) 注入迁移脚本: 将旧版保存的 127.0.0.1:9090 迁移为当前访问地址
  awk 'NR==FNR { lines[NR]=$0; n=NR; next } { if (index($0, "</body>") > 0) { for (i=1; i<=n; i++) print lines[i] } print }' patches/yacd-migrate-base-url.html build/yacd/index.html > build/yacd/index.html.new
  mv build/yacd/index.html.new build/yacd/index.html
  (cd build/yacd && pnpm install && pnpm build)
  rm -rf static/yacd && cp -r build/yacd/public static/yacd

  git clone --depth 1 --branch "$MCXD_VER" https://github.com/MetaCubeX/metacubexd.git build/official
  (cd build/official && pnpm install && pnpm build)
  rm -rf static/official && cp -r build/official/packages/ui/.output/public static/official

  rm -rf build/yacd build/official
"""

[tasks.linux-arm64-mihomo]
depends = ["prepare-dashboard"]
run = """
  PLAT=linux-arm64; GOARCH=arm64; GOAMD64=
  VER=$(curl -sSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.name')
  curl -sSL "https://github.com/MetaCubeX/mihomo/releases/download/$VER/mihomo-$PLAT-$VER.gz" > build/mihomo-$PLAT.gz
  gzip -d -f build/mihomo-$PLAT.gz 2>/dev/null || true
  chmod +x build/mihomo-$PLAT
  cp -f build/mihomo-$PLAT static/xclash
  BIN=tpclash-mihomo-linux-$GOARCH
  GOOS=linux GOARCH=$GOARCH GOARM= GOAMD64=$GOAMD64 GOMIPS= \
    go build -trimpath -o "build/$BIN" \
    -ldflags "-w -s \
      -X 'main.build=$(date "+%F %T")' \
      -X 'main.commit=$(git rev-parse HEAD)' \
      -X 'main.version=$(git describe --tags --always)' \
      -X 'main.clash=Mihomo $VER' \
      -X 'main.branch=mihomo' \
      -X 'main.binName=$BIN'"
"""

[tasks.linux-amd64-mihomo]
depends = ["prepare-dashboard"]
run = """
  PLAT=linux-amd64-compatible; GOARCH=amd64; GOAMD64=
  VER=$(curl -sSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.name')
  curl -sSL "https://github.com/MetaCubeX/mihomo/releases/download/$VER/mihomo-$PLAT-$VER.gz" > build/mihomo-$PLAT.gz
  gzip -d -f build/mihomo-$PLAT.gz 2>/dev/null || true
  chmod +x build/mihomo-$PLAT
  cp -f build/mihomo-$PLAT static/xclash
  BIN=tpclash-mihomo-linux-$GOARCH
  GOOS=linux GOARCH=$GOARCH GOARM= GOAMD64=$GOAMD64 GOMIPS= \
    go build -trimpath -o "build/$BIN" \
    -ldflags "-w -s \
      -X 'main.build=$(date "+%F %T")' \
      -X 'main.commit=$(git rev-parse HEAD)' \
      -X 'main.version=$(git describe --tags --always)' \
      -X 'main.clash=Mihomo $VER' \
      -X 'main.branch=mihomo' \
      -X 'main.binName=$BIN'"
"""

[tasks.linux-amd64-v3-mihomo]
depends = ["prepare-dashboard"]
run = """
  PLAT=linux-amd64; GOARCH=amd64; GOAMD64=v3
  VER=$(curl -sSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.name')
  curl -sSL "https://github.com/MetaCubeX/mihomo/releases/download/$VER/mihomo-$PLAT-$VER.gz" > build/mihomo-$PLAT.gz
  gzip -d -f build/mihomo-$PLAT.gz 2>/dev/null || true
  chmod +x build/mihomo-$PLAT
  cp -f build/mihomo-$PLAT static/xclash
  BIN=tpclash-mihomo-linux-amd64-v3
  GOOS=linux GOARCH=$GOARCH GOARM= GOAMD64=$GOAMD64 GOMIPS= \
    go build -trimpath -o "build/$BIN" \
    -ldflags "-w -s \
      -X 'main.build=$(date "+%F %T")' \
      -X 'main.commit=$(git rev-parse HEAD)' \
      -X 'main.version=$(git describe --tags --always)' \
      -X 'main.clash=Mihomo $VER' \
      -X 'main.branch=mihomo' \
      -X 'main.binName=$BIN'"
"""

[tasks.build-all]
depends = ["prepare-dashboard"]
run = """
  set -e
  VER=$(curl -sSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.name')

  for KEY in 386 amd64 amd64-v3 arm64 arm32 riscv64; do
    case "$KEY" in
      386)               PLAT=linux-386;                 GOARCH=386;      GOAMD64=; GOARM=; GOMIPS= ;;
      amd64)             PLAT=linux-amd64-compatible;    GOARCH=amd64;    GOAMD64=; GOARM=; GOMIPS= ;;
      amd64-v3)          PLAT=linux-amd64;               GOARCH=amd64;    GOAMD64=v3; GOARM=; GOMIPS= ;;
      arm64)             PLAT=linux-arm64;               GOARCH=arm64;    GOAMD64=; GOARM=; GOMIPS= ;;
      arm32)             PLAT=linux-armv7;               GOARCH=arm;      GOAMD64=; GOARM=7; GOMIPS= ;;
      riscv64)           PLAT=linux-riscv64;             GOARCH=riscv64;  GOAMD64=; GOARM=; GOMIPS= ;;
    esac

    curl -sSL "https://github.com/MetaCubeX/mihomo/releases/download/$VER/mihomo-$PLAT-$VER.gz" > "build/mihomo-$PLAT.gz"
    gzip -d -f "build/mihomo-$PLAT.gz" 2>/dev/null || true
    chmod +x "build/mihomo-$PLAT"
    cp -f "build/mihomo-$PLAT" static/xclash

    BIN=tpclash-mihomo-linux-$KEY
    echo "[mise] building $BIN ..."
    GOOS=linux GOARCH=$GOARCH GOARM=$GOARM GOAMD64=$GOAMD64 GOMIPS=$GOMIPS \
      go build -trimpath -o "build/$BIN" \
      -ldflags "-w -s \
        -X 'main.build=$(date "+%F %T")' \
        -X 'main.commit=$(git rev-parse HEAD)' \
        -X 'main.version=$(git describe --tags --always)' \
        -X 'main.clash=Mihomo $VER' \
        -X 'main.branch=mihomo' \
        -X 'main.binName=$BIN'"
  done
"""

[tasks.package]
depends = ["build-all"]
run = """
  set -e
  mkdir -p build/dist
  for BIN in tpclash-mihomo-linux-386 tpclash-mihomo-linux-amd64 tpclash-mihomo-linux-amd64-v3 \
             tpclash-mihomo-linux-arm64 tpclash-mihomo-linux-arm32 tpclash-mihomo-linux-riscv64; do
    [ -f "build/$BIN" ] || continue
    tar czf "build/dist/$BIN.tar.gz" -C build "$BIN"
    gzip -9 -c "build/$BIN" > "build/dist/$BIN.gz"
  done
  (cd build/dist && sha256sum * > SHA256SUMS)
  echo "[mise] 打包完成: build/dist/"
"""

[tasks.default]
run = """
  mise run build-all
  mise run package
"""
